# Netlify deploy config. vercel.json is kept alongside it; neither platform
# reads the other's file, so both remain valid targets.

[build]
  command = "npm run build"
  publish = "dist"

# The API is reached through this site, not directly. A browser then treats
# the session cookie as first-party. Phones (Safari, iOS Chrome, many Android
# browsers) drop cookies set by a different site, which logged people out
# straight after signing in.
[[redirects]]
  from = "/api/*"
  to = "https://pcnsportivalp-api.netlify.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The dashboard is an administrative surface: never indexed, never framed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
